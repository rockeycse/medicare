services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: medicare_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - medicare_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: medicare_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - medicare_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: medicare_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - medicare_db_data:/var/lib/mysql
    networks:
      - medicare_network

  redis:
    image: redis:alpine
    container_name: medicare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medicare_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: medicare_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www
    networks:
      - medicare_network
    depends_on:
      - db
      - redis

networks:
  medicare_network:
    driver: bridge

volumes:
  medicare_db_data:
    driver: local